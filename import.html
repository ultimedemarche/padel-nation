<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel Nation · Import</title>
<style>
  :root { color-scheme: dark; --bg: #04060d; --ink: #eef3ff; --muted: rgba(226,234,255,.62); --edge: rgba(255,255,255,.16); --accent: #5ef2b8; --warn: #ff9a76; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(80% 60% at 30% 10%, #0c3a2e, var(--bg)); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { width: min(440px, 100%); display: grid; gap: 12px; padding: 24px; border-radius: 24px; background: rgba(255,255,255,.07); border: 1px solid var(--edge); }
  h1 { margin: 0; font-size: 1.3rem; }
  p { margin: 0; color: var(--muted); }
  input { height: 46px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(255,255,255,.08); color: var(--ink); padding: 0 12px; font-size: 1rem; }
  button { min-height: 48px; border-radius: 999px; border: 0; font-weight: 700; font-size: 1rem; color: #04120c; background: linear-gradient(120deg, #35f0a6, #22c3e6); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  pre { margin: 0; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.35); white-space: pre-wrap; font-size: .85rem; max-height: 40vh; overflow: auto; }
  .err { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Copy data into Firebase</h1>
  <p>One-time step: copies the sales, bookings, cash outs and price list from the Claude version into your Firebase database. Running it again is safe; nothing is duplicated.</p>

  <form id="signin" hidden>
    <p>Sign in with the Firebase login you created.</p>
    <input id="email" type="email" autocomplete="username" placeholder="Email" required>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Password" required>
    <button type="submit">Sign in</button>
  </form>

  <div id="ready" hidden>
    <p id="who"></p>
    <p>Data file: <span id="fileInfo">loading…</span></p>
    <input id="picker" type="file" accept="application/json" hidden>
    <button id="go" disabled>Copy data now</button>
  </div>
  <pre id="log" hidden></pre>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyDUwEyZBIIlxcbR3pNYzwg61r7RrNaqi8g",
  authDomain: "padel-nation.firebaseapp.com",
  projectId: "padel-nation",
  storageBucket: "padel-nation.firebasestorage.app",
  messagingSenderId: "214880130498",
  appId: "1:214880130498:web:941bddea3317dc989ab25b"
});
const fs = getFirestore(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const log = msg => { $("log").hidden = false; $("log").textContent += msg + "\n"; };
const r3 = n => Math.round(n * 1000) / 1000;
let data = null;

onAuthStateChanged(auth, user => {
  $("signin").hidden = !!user;
  $("ready").hidden = !user;
  if (user) { $("who").textContent = "Signed in as " + user.email; loadFile(); }
});

$("signin").onsubmit = async ev => {
  ev.preventDefault();
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); $("pass").value = ""; }
  catch (e) { log("Sign-in failed: " + (e.code || e.message)); }
};

async function loadFile() {
  try {
    const res = await fetch("migration/data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    useData(await res.json());
  } catch {
    // On the published site the data file isn't there (it's kept off GitHub): pick it from the computer.
    $("fileInfo").textContent = "choose migration/data.json";
    $("picker").hidden = false;
  }
}
$("picker").onchange = async () => { const f = $("picker").files[0]; if (f) useData(JSON.parse(await f.text())); };

function useData(d) {
  data = d;
  const n = k => Object.keys(d[k] || {}).length;
  $("fileInfo").textContent = n("entries") + " sales, " + n("bookings") + " bookings, " + n("cashouts") + " cash outs, " + n("drawer") + " previous-cash days, price list " + (n("config") ? "yes" : "no");
  $("go").disabled = false;
}

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    let count = 0;
    for (const coll of ["config", "bookings", "entries", "cashouts", "drawer"]) {
      for (const [id, body] of Object.entries(data[coll] || {})) {
        const doc0 = coll === "drawer" && !body.date ? { ...body, date: id } : body;
        await setDoc(doc(fs, coll, id), doc0);
        count++;
      }
      log("✓ " + coll + ": " + Object.keys(data[coll] || {}).length);
    }
    // Daily cash summaries used by the Previous cash carry-over.
    const days = {};
    for (const e of Object.values(data.entries || {})) if (e.cash) (days[e.date] = days[e.date] || { cashIn: 0, cashOut: 0 }).cashIn += e.amount;
    for (const o of Object.values(data.cashouts || {})) (days[o.date] = days[o.date] || { cashIn: 0, cashOut: 0 }).cashOut += o.amount;
    for (const [date, s] of Object.entries(days)) {
      await setDoc(doc(fs, "days", date), { date, cashIn: r3(s.cashIn), cashOut: r3(s.cashOut), at: Date.now() });
    }
    log("✓ daily cash summaries: " + Object.keys(days).length);
    log("\nDone. " + count + " records copied. You can close this page.");
  } catch (e) {
    log("Stopped: " + (e.code || e.message));
    if (e.code === "permission-denied") log("Check the Firestore Rules from Step 2 were published.");
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
